name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: 打包内嵌资源
        run: go run ./cmd/assetpack -src assets_src -out assets.zip

      - name: 单元测试（含签名与 openssl 的字节级一致性对比）
        run: go test -v ./...

      - name: 编译单文件 exe
        run: |
          $env:CGO_ENABLED="0"
          go build -trimpath -ldflags "-s -w" -o kdxf-unlock-toolbox.exe .

      - uses: actions/upload-artifact@v4
        with:
          name: kdxf-unlock-toolbox
          path: kdxf-unlock-toolbox.exe

      - name: 发布 Release（打 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: kdxf-unlock-toolbox.exe
          generate_release_notes: true
